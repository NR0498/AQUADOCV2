[project]
name = "aquadoc"
version = "0.2.0"
description = "Estimate optically detectable water-quality parameters from Sentinel-2 multispectral imagery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies for the API (what Vercel installs). Keep this list lean:
# the deployed Python bundle must stay under Vercel's function size limit.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "requests>=2.31.0",
    "rasterio>=1.3.9",
    "shapely>=2.0",
    "pyshp>=2.3",
    "pystac>=1.10.0",
    "planetary-computer>=1.0.0",
    "psycopg[binary]>=3.2",  # PostgreSQL (Neon) when DATABASE_URL is set
]

[project.optional-dependencies]
# Offline model training on public reflectance data (not deployed).
training = [
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
]
# Shelved lab-measurement matching workflow in research/ (not deployed).
research = [
    "pandas>=2.1",
    "scikit-learn>=1.4",
]
dev = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aquadoc_core*", "research*", "training*"]

[tool.setuptools.package-data]
# Trained model weights and model card ship with the API package.
aquadoc_core = ["models/*.npz", "models/*.json"]
